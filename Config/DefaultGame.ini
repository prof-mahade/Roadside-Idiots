; Runtime presentation assets are discovered dynamically through Asset Registry,
; so cook the folders that contain the assets we actually use. Do NOT cook the
; free packs wholesale: both include legacy/sample content irrelevant to Demo 1.
+DirectoriesToAlwaysCook=(Path="/Game/MotoInteractionAnims")
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Mannequins/Meshes")
+DirectoriesToAlwaysCook=(Path="/Game/PN_Banana/Meshes/plants")
+DirectoriesToAlwaysCook=(Path="/Game/PN_tropicalGroundPlants/Meshes")

; Dependencies of the cooked meshes pull in only the materials/textures actually
; required by those meshes. Avoid forcing whole material/texture trees, which was
; cooking unused broken sample material instances from the free vegetation packs.

; Belt-and-suspenders exclusions for obsolete/demo content bundled with free packs.
; None of these paths are used by Roadside Idiots runtime code.
+DirectoriesToNeverCook=(Path="/Game/PN_Banana/UE4_ThirdPerson")
+DirectoriesToNeverCook=(Path="/Game/PN_Banana/Blueprints")
+DirectoriesToNeverCook=(Path="/Game/PN_Banana/Map")
+DirectoriesToNeverCook=(Path="/Game/PN_tropicalGroundPlants/UE4_ThirdPerson")
+DirectoriesToNeverCook=(Path="/Game/PN_tropicalGroundPlants/Blueprints")
+DirectoriesToNeverCook=(Path="/Game/PN_tropicalGroundPlants/Map")
